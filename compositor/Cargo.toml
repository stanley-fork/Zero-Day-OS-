[package]
name = "zeroday-comp"
version = "4.3.0"
edition = "2021"
description = "Wayland compositor for ZERO-DAY OS on M5Stack Cardputer Zero (320x170, 46-key, 512MB RAM)"
authors = ["ZERO-DAY OS"]

[dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "net", "socket"] }
libc = "0.2"
ctrlc = "3"

smithay = { version = "0.7", default-features = false, features = [
    "backend_drm", "backend_gbm", "backend_egl",
    "backend_libinput", "backend_session", "backend_udev",
    "renderer_gl", "wayland_frontend", "desktop",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1