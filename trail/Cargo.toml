[package]
name = "zeroday-trail"
version = "1.0.0"
edition = "2021"
description = "Breadcrumb navigation daemon for ZERO-DAY OS — WiFi fingerprint waypointing and exit guidance"
authors = ["ZERO-DAY OS"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1