[package]
name = "zeroday-term"
version = "1.0.0"
edition = "2021"
description = "Terminal emulator for ZERO-DAY OS on M5Stack Cardputer Zero (320x170, 46-key, no mouse)"
authors = ["ZERO-DAY OS"]

[dependencies]
# Terminal emulation
vte = "0.13"
# PTY handling
portable-pty = "0.8"
# Logging
log = "0.4"
env_logger = "0.11"
# CLI
clap = { version = "4", features = ["derive"] }
# Signal handling
nix = { version = "0.29", features = ["signal", "process", "fs"] }
libc = "0.2"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1